<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
            max-width: 500px;
            font-size: 0.95rem;
        }

        /* Container & State Controls */
        .game-wrapper {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #334155;
            position: relative;
        }

        /* Radio Buttons for Snake Position & Food State */
        input[type="radio"] {
            display: none;
        }

        .board {
            position: relative;
            width: 360px;
            height: 360px;
            background-color: #090d16;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            border: 3px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Snake Head */
        .snake-head {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #10b981;
            border-radius: 6px;
            box-shadow: 0 0 12px #10b981;
            transition: all 0.2s ease;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snake-head::before, .snake-head::after {
            content: '';
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 6px;
        }
        .snake-head::before { left: 6px; }
        .snake-head::after { right: 6px; }

        /* Snake Body Segments */
        .snake-body {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #059669;
            border-radius: 6px;
            transition: all 0.25s ease;
            opacity: 0.85;
            z-index: 4;
        }

        /* Food Item */
        .food {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 12px #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.85); box-shadow: 0 0 6px #ef4444; }
            100% { transform: scale(1.05); box-shadow: 0 0 14px #ef4444; }
        }

        .food::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #fca5a5;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 7px;
        }

        /* Grid Placement CSS Logic (12x12 grid, cell size 30px) */
        /* Default Head Position: (3,3) -> left: 90px, top: 90px */
        
        /* Positioning logic based on active radio buttons */
        #p-0-0:checked ~ .board .snake-head { left: 0px; top: 0px; }
        #p-1-0:checked ~ .board .snake-head { left: 30px; top: 0px; }
        #p-2-0:checked ~ .board .snake-head { left: 60px; top: 0px; }
        #p-3-0:checked ~ .board .snake-head { left: 90px; top: 0px; }
        #p-4-0:checked ~ .board .snake-head { left: 120px; top: 0px; }
        #p-5-0:checked ~ .board .snake-head { left: 150px; top: 0px; }

        #p-0-1:checked ~ .board .snake-head { left: 0px; top: 30px; }
        #p-1-1:checked ~ .board .snake-head { left: 30px; top: 30px; }
        #p-2-1:checked ~ .board .snake-head { left: 60px; top: 30px; }
        #p-3-1:checked ~ .board .snake-head { left: 90px; top: 30px; }
        #p-4-1:checked ~ .board .snake-head { left: 120px; top: 30px; }
        #p-5-1:checked ~ .board .snake-head { left: 150px; top: 30px; }

        #p-0-2:checked ~ .board .snake-head { left: 0px; top: 60px; }
        #p-1-2:checked ~ .board .snake-head { left: 30px; top: 60px; }
        #p-2-2:checked ~ .board .snake-head { left: 60px; top: 60px; }
        #p-3-2:checked ~ .board .snake-head { left: 90px; top: 60px; }
        #p-4-2:checked ~ .board .snake-head { left: 120px; top: 60px; }
        #p-5-2:checked ~ .board .snake-head { left: 150px; top: 60px; }

        #p-0-3:checked ~ .board .snake-head { left: 0px; top: 90px; }
        #p-1-3:checked ~ .board .snake-head { left: 30px; top: 90px; }
        #p-2-3:checked ~ .board .snake-head { left: 60px; top: 90px; }
        #p-3-3:checked ~ .board .snake-head { left: 90px; top: 90px; }
        #p-4-3:checked ~ .board .snake-head { left: 120px; top: 90px; }
        #p-5-3:checked ~ .board .snake-head { left: 150px; top: 90px; }

        /* Controls */
        .controls {
            margin-top: 25px;
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 10px;
        }

        .btn {
            background: #334155;
            color: #f8fafc;
            border: 2px solid #475569;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
            text-align: center;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: #475569;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }

        .btn-up { grid-area: up; }
        .btn-down { grid-area: down; }
        .btn-left { grid-area: left; }
        .btn-right { grid-area: right; }

        /* Food Locations */
        .food-1 { left: 180px; top: 90px; }
        .food-2 { left: 90px; top: 180px; }
        .food-3 { left: 240px; top: 240px; }

        .score-board {
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            background: #0f172a;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <h1>Pure CSS Snake Game</h1>
    <p class="subtitle">Interactive CSS-only state machine. Control the snake using directional buttons below!</p>

    <div class="game-wrapper">
        <div class="score-board">
            <span>Score: <strong style="color: #10b981;">Eat Food to Grow!</strong></span>
        </div>

        <!-- Position State Radios -->
        <input type="radio" name="pos" id="p-0-0">
        <input type="radio" name="pos" id="p-1-0">
        <input type="radio" name="pos" id="p-2-0">
        <input type="radio" name="pos" id="p-3-0">
        <input type="radio" name="pos" id="p-4-0">
        <input type="radio" name="pos" id="p-5-0">

        <input type="radio" name="pos" id="p-0-1">
        <input type="radio" name="pos" id="p-1-1">
        <input type="radio" name="pos" id="p-2-1">
        <input type="radio" name="pos" id="p-3-1">
        <input type="radio" name="pos" id="p-4-1">
        <input type="radio" name="pos" id="p-5-1">

        <input type="radio" name="pos" id="p-0-2">
        <input type="radio" name="pos" id="p-1-2">
        <input type="radio" name="pos" id="p-2-2">
        <input type="radio" name="pos" id="p-3-2">
        <input type="radio" name="pos" id="p-4-2">
        <input type="radio" name="pos" id="p-5-2">

        <input type="radio" name="pos" id="p-0-3" checked>
        <input type="radio" name="pos" id="p-1-3">
        <input type="radio" name="pos" id="p-2-3">
        <input type="radio" name="pos" id="p-3-3">
        <input type="radio" name="pos" id="p-4-3">
        <input type="radio" name="pos" id="p-5-3">

        <!-- Game Board -->
        <div class="board">
            <div class="snake-head"></div>
            <div class="snake-body" style="left: 60px; top: 90px;"></div>
            <div class="snake-body" style="left: 30px; top: 90px;"></div>
            
            <div class="food food-1"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <label for="p-3-2" class="btn btn-up">▲</label>
            <label for="p-2-3" class="btn btn-left">◄</label>
            <label for="p-4-3" class="btn btn-right">►</label>
            <label for="p-3-3" class="btn btn-down">▼</label>
        </div>
    </div>

</body>
</html>
